# Recipe nixos/lab – what is in it (modules), how it looks and which keys it uses, how a VM from it runs.
# A recipe is data only. Fields: see CONTRIBUTING.md at the root of this repository.

"$schema" = "https://omaflake.dev/schema/recipe/v2.json"
author = "omaflake"
license = "MIT"
description = "For developing omaflake: the omaflake Test app (camera, sound, microphone, clipboard), debug tools and omaflake itself to try its Linux app and TUI (VMs cannot start inside); fresh at every start."
description_de = "Zum Entwickeln von omaflake: die App omaflake Test (Kamera, Ton, Mikrofon, Zwischenablage), Debug-Werkzeuge und omaflake selbst, um seine Linux-App und TUI auszuprobieren (VMs starten darin nicht); bei jedem Start frisch."
tags = ["development", "test"]
lab = true             # development recipe: shown only in developer mode
platform = "nixos"
systems = ["aarch64-linux", "x86_64-linux"]

modules = [
  "omaflake/hyprland",
  "omaflake/shell",
  "omaflake/wezterm",
  "omaflake/zellij",
  "omaflake/neovim",
  "omaflake/omaflake-dev",
]
look = "omaflake/omaflake"          # suggested; the build may choose another installed look
keymaps = ["omaflake/default"]

[requirements]                     # the least a VM from it needs; a smaller profile gets a warning
cpus = 4
memory_gb = 8
disk_gb = 60

[vm]                               # how a VM from it runs
display = "gpu"
network = "shared"
share = true
ephemeral = true
microphone = true
camera = true
