# Recipe nixos/neovim-research – how a VM from it runs; what is inside it is default.nix next to this file.
# Fields: see CONTRIBUTING.md at the root of this repository.

"$schema" = "https://omaflake.dev/schema/recipe/v1.json"
systems = ["aarch64-linux", "x86_64-linux"] # what it can be built for: aarch64-linux, x86_64-linux | aarch64-darwin
author = "omaflake"
license = "MIT"
display = "gpu"
description = "Writing and research: TeX Live (full) and Typst with a live PDF beside neovim (vimtex, zathura), Jupyter, pandas, pandoc."
description_de = "Schreiben und Forschen: TeX Live (komplett) und Typst mit Live-PDF neben neovim (vimtex, zathura), Jupyter, pandas, pandoc."
tags = ["latex", "typst", "neovim", "python", "jupyter", "pandoc"]
cpus = 6
memory_gb = 12
disk_gb = 60
network = "shared"
share = true
ephemeral = false
