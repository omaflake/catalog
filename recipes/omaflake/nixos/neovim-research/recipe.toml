# Recipe nixos/neovim-research – what is in it (modules), how it looks and which keys it uses, how a VM from it runs.
# A recipe is data only. Fields: see CONTRIBUTING.md at the root of this repository.

"$schema" = "https://omaflake.dev/schema/recipe/v2.json"
author = "omaflake"
license = "MIT"
description = "Writing and research: TeX Live (full) and Typst with a live PDF beside neovim (vimtex, zathura), Jupyter, pandas, pandoc."
description_de = "Schreiben und Forschen: TeX Live (komplett) und Typst mit Live-PDF neben neovim (vimtex, zathura), Jupyter, pandas, pandoc."
tags = ["latex", "typst", "neovim", "python", "jupyter", "pandoc"]
platform = "nixos"
systems = ["aarch64-linux", "x86_64-linux"]

modules = [
  "omaflake/hyprland",
  "omaflake/shell",
  "omaflake/wezterm",
  "omaflake/zellij",
  "omaflake/neovim",
  "omaflake/zathura",
  "omaflake/latex",
  "omaflake/typst",
  "omaflake/python-data",
  "omaflake/pandoc",
]
look = "omaflake/omaflake"          # suggested; the build may choose another installed look
keymaps = ["omaflake/default"]

[requirements]                     # the least a VM from it needs; a smaller profile gets a warning
cpus = 6
memory_gb = 12
disk_gb = 60

[vm]                               # how a VM from it runs
display = "gpu"
network = "shared"
share = true
ephemeral = false
