# Recipe macos/research – how a VM from it runs; what is inside it is default.nix next to this file.
# Fields: see CONTRIBUTING.md at the root of this repository.

"$schema" = "https://omaflake.dev/schema/recipe/v1.json"
systems = ["aarch64-darwin"] # what it can be built for: aarch64-linux, x86_64-linux | aarch64-darwin
author = "omaflake"
license = "MIT"
requires = ["omaflake/macos/minimal"]   # imported as ../minimal in default.nix
description = "Writing and research: TeX Live (full), VS Code for LaTeX and Typst (VS Code is unfree software), WezTerm with Zellij, Typst, pandoc, lazygit, Homebrew."
description_de = "Schreiben und Forschen: TeX Live (komplett), VS Code für LaTeX und Typst (VS Code ist keine freie Software), WezTerm mit Zellij, Typst, pandoc, lazygit, Homebrew."
tags = ["latex", "typst", "vscode", "wezterm", "zellij", "pandoc", "homebrew"]
display = "window"
cpus = 4
memory_gb = 8
disk_gb = 80
network = "shared"
share = true
ephemeral = false
