# Module nixos/zellij – the terminal multiplexer. What it does is default.nix next to this file; its key bindings are
# all here: default.nix writes Zellij's keybinds from them (each mode's binds, `does` then a switch to `after`).
# The keys are Zellij's "Unlock First (non-colliding)" preset with Ctrl as the primary modifier (zellij 0.45.1,
# default-plugins/configuration/src/presets.rs, MIT License, Copyright (c) 2020 Zellij contributors), without its Alt
# shortcuts: the guests' Mac layout makes both Option keys level 3, so no Alt arrives. Lost with them: moving tabs,
# swap layouts, pane groups. Where the preset binds a key both in a shared block and in a mode, the mode's wins (as in
# Zellij), so only the binding that works is listed for that mode.

"$schema" = "https://omaflake.dev/schema/module/v2.json"
version = "2.0.1"
author = "omaflake"
license = "MIT"
title = "Zellij"
description = "The Zellij multiplexer with keys that leave the editor's alone: locked until Ctrl+g. Its session \"main\" opens in a window of its own (Super+Shift+Return) or with zj."
description_de = "Der Multiplexer Zellij mit Tasten, die die des Editors in Ruhe lassen: gesperrt bis Strg+G. Seine Sitzung „main“ öffnet sich in einem eigenen Fenster (Super+Umschalt+Return) oder mit zj."
tags = ["zellij", "terminal"]
provides = ["multiplexer"]
needs = ["terminal"]
enhances = ["omaflake/hyprland"]
runs_in = ["terminal"]

# ---------- Modes ----------

[modes.locked]
title = "Locked"
title_de = "Gesperrt"
start = true

[modes.normal]
title = "Unlocked"
title_de = "Entsperrt"

[modes.pane]
title = "Pane"
title_de = "Bereich"

[modes.tab]
title = "Tab"
title_de = "Tab"

[modes.resize]
title = "Resize"
title_de = "Größe"

[modes.move]
title = "Move"
title_de = "Verschieben"

[modes.scroll]
title = "Scroll"
title_de = "Scrollen"

[modes.search]
title = "Search"
title_de = "Suche"

[modes.entersearch]
title = "Search term"
title_de = "Suchbegriff"

[modes.renametab]
title = "Rename tab"
title_de = "Tab umbenennen"

[modes.renamepane]
title = "Rename pane"
title_de = "Bereich umbenennen"

[modes.session]
title = "Session"
title_de = "Sitzung"

# ---------- On the desktop ----------

[actions.session]
title = "A terminal window in the Zellij session \"main\""
title_de = "Ein Terminalfenster in der Zellij-Sitzung „main“"
key = "Super+Shift+Return"
desktop = true

# ---------- Locking, quitting, entering the modes ----------

[actions.unlock]
title = "Unlock Zellij's keys"
title_de = "Zellijs Tasten entsperren"
key = "Ctrl+g"
mode = "locked"
after = "normal"

[actions.lock]
title = "Lock Zellij's keys again"
title_de = "Zellijs Tasten wieder sperren"
key = "Ctrl+g"
mode = ["normal", "pane", "tab", "resize", "move", "scroll", "search", "entersearch", "session"]
after = "locked"

[actions.lock-return]
title = "Lock (back to typing)"
title_de = "Sperren (zurück zum Tippen)"
key = "Return"
mode = ["normal", "pane", "tab", "resize", "move", "scroll", "search", "session"]
after = "locked"

[actions.lock-escape]
title = "Lock (cancel)"
title_de = "Sperren (abbrechen)"
key = "Escape"
mode = ["normal", "pane", "tab", "resize", "move", "scroll", "search", "session"]
after = "locked"

[actions.quit]
title = "Quit Zellij"
title_de = "Zellij beenden"
key = "Ctrl+q"
mode = ["normal", "pane", "tab", "resize", "move", "scroll", "search", "entersearch", "session"]
does = "Quit"

[actions.pane-mode]
title = "Pane mode"
title_de = "Bereich-Modus"
key = "p"
mode = ["normal", "tab", "resize", "scroll"]
after = "pane"

[actions.tab-mode]
title = "Tab mode"
title_de = "Tab-Modus"
key = "t"
mode = ["normal", "pane", "resize", "move", "scroll", "search", "session"]
after = "tab"

[actions.resize-mode]
title = "Resize mode"
title_de = "Größe-Modus"
key = "r"
mode = ["normal", "move", "scroll", "search", "session"]
after = "resize"

[actions.move-mode]
title = "Move mode"
title_de = "Verschieben-Modus"
key = "m"
mode = ["normal", "pane", "tab", "resize", "session"]
after = "move"

[actions.scroll-mode]
title = "Scroll mode"
title_de = "Scroll-Modus"
key = "s"
mode = ["normal", "resize", "move", "search"]
after = "scroll"

[actions.session-mode]
title = "Session mode"
title_de = "Sitzungs-Modus"
key = "o"
mode = ["normal", "pane", "tab", "resize", "move", "scroll"]
after = "session"

