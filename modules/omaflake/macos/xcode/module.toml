# Module macos/xcode – Xcode. What it does is default.nix next to this file.

"$schema" = "https://omaflake.dev/schema/module/v3.json"
version = "1.1.0"
author = "omaflake"
license = "MIT"
title = "Xcode"
description = "Xcode 27.2 from the Nix store, copied to Applications and in the Dock, selected and ready (licence accepted, first launch done). Apple does not allow passing Xcode on: download Xcode_27.2.xip yourself – omaflake finds it in your Downloads folder, or you choose it on the build page. Xcode is not free software."
description_de = "Xcode 27.2 aus dem Nix-Store, in Programme kopiert und im Dock, ausgewählt und bereit (Lizenz angenommen, erster Start erledigt). Apple erlaubt nicht, Xcode weiterzugeben: Lade Xcode_27.2.xip selbst – omaflake findet es in deinem Download-Ordner, oder du wählst es auf der Build-Seite aus. Xcode ist keine freie Software."
tags = ["development", "xcode"]
unfree = true

# The file it needs (module/v3, omaflake 0.8.3 – plan B198): the same name and hash as default.nix's requireFile.
# omaflake looks for it in these places and adds it to the Nix Store itself; else the build page asks for it.
[[files]]
name = "Xcode.app"
hash = "sha256-zs5OMdddog5+11qHlkkDMC7liJ4qllxmF4qiVy4zdf8="
title = "Xcode 27.2"
from = ["Xcode_27.2.xip", "Xcode.app"]
search = ["~/Downloads", "~/Desktop"]
url = "https://developer.apple.com/download/all/?q=Xcode%2027.2"
